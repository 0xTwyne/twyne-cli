[project]
name = "twyne-cli"
version = "0.1.0"
description = "Lightweight CLI for querying Twyne protocol state on-chain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Upper bounds prevent `uv lock` refreshes from silently pulling in a
    # breaking-change major (or pre-1.0 0.x→0.y, which Ape and httpx treat
    # as breaking). Bump the ceiling intentionally when adopting a new major.
    "eth-ape[recommended-plugins]>=0.8.47,<0.9",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<0.29",
    "requests>=2.31,<3",
]

[project.scripts]
twyne = "twyne_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twyne_cli"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
