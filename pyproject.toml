[project]
name = "twyne-cli"
version = "0.1.0"
description = "Lightweight CLI for querying Twyne protocol state on-chain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eth-ape[recommended-plugins]>=0.8.47",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
twyne = "twyne_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twyne_cli"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
